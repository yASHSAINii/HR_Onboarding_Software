<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DayZero</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
    </style>

    <link rel="stylesheet" href="/Frontend/src/output.css">
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-white shadow">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center">
                <img src="human.png" alt="Logo" class="h-10 w-10 mr-3">
                <h1 class="text-2xl font-bold text-gray-800">Admin Dashboard</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span id="userName" class="text-gray-600">Loading...</span>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
                    <i class="fas fa-sign-out-alt mr-2"></i>Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Welcome to HR Onboarding System</h2>
            <p class="text-gray-600 mb-4">You have successfully connected your frontend to the backend API.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- User Info Card -->
                <div class="bg-blue-50 p-4 rounded-lg">
                    <h3 class="font-semibold text-blue-800 mb-2"><i class="fas fa-user mr-2"></i>User Information</h3>
                    <div id="userInfo" class="text-gray-700">
                        Loading user data...
                    </div>
                </div>
                
                <!-- API Status Card -->
                <div class="bg-green-50 p-4 rounded-lg">
                    <h3 class="font-semibold text-green-800 mb-2"><i class="fas fa-plug mr-2"></i>API Connection</h3>
                    <p class="text-gray-700 mb-2">✅ Backend connected successfully</p>
                    <p class="text-sm text-gray-500">API: http://localhost:3000</p>
                    <button onclick="testConnection()" class="mt-3 bg-green-500 text-white px-3 py-1 rounded text-sm">
                        Test Connection
                    </button>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Quick Actions</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button class="bg-blue-500 text-white p-4 rounded-lg hover:bg-blue-600">
                    <i class="fas fa-users text-2xl mb-2"></i>
                    <div class="font-semibold">Manage Users</div>
                </button>
                <button class="bg-green-500 text-white p-4 rounded-lg hover:bg-green-600">
                    <i class="fas fa-file-alt text-2xl mb-2"></i>
                    <div class="font-semibold">View Reports</div>
                </button>
                <button class="bg-purple-500 text-white p-4 rounded-lg hover:bg-purple-600">
                    <i class="fas fa-cog text-2xl mb-2"></i>
                    <div class="font-semibold">Settings</div>
                </button>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script>
        // Check if user is logged in
        function checkAuth() {
            const user = localStorage.getItem('user');
            if (!user) {
                window.location.href = 'login.html';
                return null;
            }
            return JSON.parse(user);
        }

        // Load user data
        function loadUserData() {
            const user = checkAuth();
            if (user) {
                document.getElementById('userName').textContent = `${user.first_name} ${user.last_name}`;
                
                const userInfo = document.getElementById('userInfo');
                userInfo.innerHTML = `
                    <p><strong>Name:</strong> ${user.first_name} ${user.last_name}</p>
                    <p><strong>Email:</strong> ${user.mail_id}</p>
                    <p><strong>Role:</strong> ${user.role}</p>
                    <p><strong>Permissions:</strong> ${user.permissions}</p>
                    <p><strong>Phone:</strong> ${user.phone_num || 'N/A'}</p>
                `;
            }
        }

        // Test API connection
        async function testConnection() {
            try {
                const response = await fetch('http://localhost:3000/');
                if (response.ok) {
                    alert('✅ API connection is working!');
                } else {
                    alert('⚠️ API connection issue');
                }
            } catch (error) {
                alert('❌ Cannot connect to backend API');
            }
        }

        // Logout function
        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            localStorage.removeItem('userType');
            window.location.href = 'login.html';
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            console.log('Admin dashboard loaded');
        });
    </script>
</body>
</html>
