<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staffo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<link rel="icon" href="human.png" type="image/png">

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">

<link rel="stylesheet" href="/Frontend/src/output.css">

</head>
<body>


    <div id="loginpage" class="grid grid-cols-3 gap-0 h-screen grid-rows-[2fr_4fr_2fr] bg-zinc-50">
<!-- login card -->
        <div id="logincard" class="col-start-2 row-start-2 bg-white h-full grid grid-rows-[1fr_0.2fr_3fr] shadow-2xl border border-slate-200 rounded-2xl p-5">

            <div class="bg-white">
                <div id="loginlogo" class="grid place-items-center"><img src="human.png" alt="logo" class="h-13 mb-5"></div>
                <div class="font-[Montserrat] text-3xl font-semibold tracking-wider"><h2>Sign into your account</h2></div>
                <div class="font-[Montserrat]"><p>Please enter your details to sign in</p></div>
            </div>
<!-- Switch -->
            <div id="switch" class="pt-4">
                 <div class="mb-5 grid place-items-center">
                <div class="inline-flex rounded-xl bg-gray-100 p-1.5 shadow-inner items-center">
                <input type="radio" id="candidate" name="userrole" class="hidden" checked>
                <input type="radio" id="recruiter" name="userrole" class="hidden">
                
                <label for="candidate" 
                       class="toggle-btn flex items-center justify-center px-17 py-2 rounded-lg cursor-pointer toggle-transition bg-blue-500 text-white shadow-md mr-0.5">
                    <i class="fas fa-user-graduate mr-3"></i>
                    <span class="font-semibold text-lg">Candidate</span>
                </label>
                
                <label for="recruiter" 
                       class="toggle-btn flex items-center justify-center px-17 py-2 rounded-lg cursor-pointer toggle-transition bg-white text-gray-700 ml-0.5">
                    <i class="fas fa-briefcase mr-3"></i>
                    <span class="font-semibold text-lg">Recruiter</span>
                </label>
                </div>
                </div>
            </div>
<!-- Login details -->
            <div id="detailsform" class="">
                <form action="">
                    <div id="emailtxt" class="">Email Address</div>
                    <input type="email" placeholder="name@company.com" required class="border border-slate-200 rounded p-1 pl-2 w-full">
                    <div id="passwordtxt" class="mt-5">Password</div>
                    <input type="password" placeholder="••••••••••••" class="border border-slate-200 rounded p-1 pl-2 mb-8 w-full">
                    
                    <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>

                    <div class="flex justify-center">
                        <button id="signinbutton" class="border border-blue-500 bg-blue-500 text-white font-semibold m-8 mb-5 p-3 px-25 rounded-lg flex justify-center text-lg cursor-pointer">Sign in</button>
                    </div>
                    <div class="flex justify-center text-sm">Forgot Password? <a href="https://mail.google.com/mail/?view=cm&fs=1&to=admin@yourcompany.com" class="ml-1 text-blue-500 font-semibold hover:underline">Contact Admin</a></div>
                </form>
            </div>
        </div>
    </div>       

 <!-- Javascript -->
    <script src="/Frontend/Public/JS/animation.js"></script>


    </body>
</html>
