<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayZero</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Chango&display=swap" rel="stylesheet">

    <link rel="icon" href="human.png" type="image/png">

    <script src="https://unpkg.com/lottie-web@latest/build/player/lottie.min.js"></script>

    <link rel="stylesheet" href="/Frontend/src/output.css">
</head>


<body>

<!-- header -->
    <div class="h-screen">
  <header class="absolute inset-x-0 top-0 z-50 bg-white">
    <nav aria-label="Global" class="flex items-center justify-between px-6 py-2 lg:px-8">
      <div class="flex lg:flex-1">
        <a href="#" class="-m-1.5 p-1.5">
          <img src="human.png" alt="" class="h-10 w-auto border border-white rounded-3xl bg-white" />
        </a>
        <div class="pt-1 px-3 text-2xl text-black font-[Bowlby_One_SC] font-weight-50 ">Day <span class="text-indigo-500">Zero</span></div>
      </div>
      
    
      <div class="hidden lg:flex lg:flex-1 lg:justify-end">
        <button class="text-black font-semibold pt-1 px-5 cursor-pointer"><a href="index.html"></a>Home</button>
        <div class="border border-indigo-500 px-2 py-1 rounded-md bg-indigo-500"><a href="login.html" class="text-sm/6 font-semibold text-white">Log in <span aria-hidden="true">&rarr;</span></a></div>
      </div>
    </nav>
    <hr class="border-gray-300">
  </header>

  <!-- homePage -->
  <div class="relative isolate px-6 pt-14 lg:px-8 bg-linear-to-b from-indigo-200 to-white">

    <div class="mx-auto max-w-2xl py-32 pt-26 pb-10">
          <div id="lottie-animation" class="absolute inset-0 -z-1 opacity-25 pointer-events-none h-100 mt-10"></div>
      <div class="hidden sm:mb-8 sm:flex sm:justify-center">
        <div class="relative rounded-full px-3 py-1 text-sm/6 text-blue-600 ring-1 ring-blue/20 font-semibold">
          New Recruitment Drive 2026 Active 
        </div>
      </div>
      <div class="text-center">
        <h1 class="text-5xl font-semibold tracking-tight text-balance text-black sm:text-7xl">OnBoarding made <span aria-hidden="true" class="text-blue-600">Seamless</span></h1>
        <p class="mt-8 text-lg font-medium text-pretty text-gray-500 sm:text-xl/8">A centralized secure hub for candidates and recruiters. Track status, verify documnets, and manage joining formalities in one place.</p>
      </div>
      <hr class="border-gray-300 mt-7">
      <div class="text-center">
        <h3 class="mt-10 text-3xl font-semibold text-gray-500">PLATFORM FEATURES</h3>
      </div>
    </div>

  </div>
</div>

<!-- animationJS -->

<script>
  lottie.loadAnimation({
    container: document.getElementById('lottie-animation'),
    renderer: 'canvas',
    loop: true,
    autoplay: true,
    path: 'abstract.json'
  });
</script>

</body>
</html>
